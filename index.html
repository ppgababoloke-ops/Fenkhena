<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fenkhena 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fadeOut 4s forwards 3s;
}

#intro h2{
  font-size:1rem;
  letter-spacing:4px;
  opacity:.7;
}

#intro h1{
  font-size:3rem;
  color:#ff004c;
  letter-spacing:6px;
  margin-top:10px;
  animation:zoom 3s ease;
}

@keyframes zoom{
  0%{transform:scale(.5);opacity:0}
  100%{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* SLIDER */
#slider{
  display:flex;
  width:600vw;
  height:100vh;
  transition:1.2s ease;
}

.slide{
  width:100vw;
  height:100vh;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
}

.slide img, .slide video{
  width:320px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.final{
  background:linear-gradient(135deg,#ff5f9e,#ff9a9e);
  overflow-y:auto;
}

h1{font-size:2.6rem;margin-bottom:15px}
h2{margin-top:10px}
p{max-width:700px;font-size:1.2rem;line-height:1.6}

button{
  padding:14px 30px;
  font-size:1.1rem;
  border:none;
  border-radius:999px;
  cursor:pointer;
  margin:10px;
  transition:.3s;
}

#yesBtn{background:white;color:#ff5f9e}
#noBtn{background:rgba(255,255,255,.8);color:#333}

#counter{margin:20px 0;font-size:1.2rem}

/* EXPLOSION */
#yesExplosion{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#ff5f9e,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:1s;
}

#yesExplosion.show{
  opacity:1;
  pointer-events:auto;
}

#yesExplosion h1{
  font-size:4rem;
  text-shadow:0 0 25px white;
}

/* Falling petals */
.fall{
  position:fixed;
  top:-20px;
  font-size:20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(120vh)}
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <h2>A Paseka Production</h2>
  <h1>FENKHENA</h1>
</div>

<!-- SLIDES -->
<div id="slider">

  <div class="slide">
    <h1>Hi Fenkhena 😍</h1>
    <img src="photo1.jpg">
  </div>

  <div class="slide">
    <p>“To everything there is a season…” – Ecclesiastes 3:1 🤍</p>
    <img src="photo2.jpg">
  </div>

  <div class="slide">
    <h1>We share food 🍽️</h1>
    <img src="photo3.jpg">
  </div>

  <div class="slide">
    <h1>We share smiles 😊</h1>
    <img src="photo4.jpg">
  </div>

  <!-- FINAL SLIDE -->
  <div class="slide final">

    <!-- Muted Background Video -->
    <video autoplay muted loop playsinline>
      <source src="video5.mp4" type="video/mp4">
    </video>

    <!-- Romantic Photo (like the one you showed) -->
    <img src="photo6.jpg">

    <h1>So why not continue sharing…</h1>
    <h1>And creating memories together on the 14th?</h1>
    <h2>Please be my Valentine ❤️</h2>

    <div id="counter"></div>

    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No</button>

  </div>

</div>

<!-- EXPLOSION SCREEN -->
<div id="yesExplosion">
  <h1>💍 DATE CONFIRMED 💖</h1>
  <p style="margin-top:20px;">Forever starts now 🤍</p>
</div>

<audio id="bgMusic" autoplay loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>

/* AUTO SLIDE */
let index=0;
const slider=document.getElementById("slider");
setTimeout(()=>{
  setInterval(()=>{
    index++;
    if(index>=5) return;
    slider.style.transform=`translateX(-${index*100}vw)`;
  },5000);
},5000);

/* COUNTER */
const start=new Date("2025-01-10");
const today=new Date();
const days=Math.floor((today-start)/(1000*60*60*24));
document.getElementById("counter").innerText=
  `We've been making memories for ${days} days 💕`;

/* SHRINK NO / GROW YES */
let scaleNo=1, scaleYes=1;
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

noBtn.addEventListener("mouseover",()=>{
  scaleNo-=0.1;
  scaleYes+=0.1;
  if(scaleNo<0.2) scaleNo=0.2;
  noBtn.style.transform=`scale(${scaleNo})`;
  yesBtn.style.transform=`scale(${scaleYes})`;
});

/* YES EXPLOSION */
yesBtn.addEventListener("click",()=>{
  document.getElementById("yesExplosion").classList.add("show");

  for(let i=0;i<200;i++){
    const el=document.createElement("div");
    el.className="fall";
    el.innerText=Math.random()>0.5?"🌹":"✨";
    el.style.left=Math.random()*100+"vw";
    el.style.animationDuration=3+Math.random()*3+"s";
    document.body.appendChild(el);
  }
});
</script>

</body>
</html>
