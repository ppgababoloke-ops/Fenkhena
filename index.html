<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fenkhena 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

/* INTRO */
#intro{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fadeOut 4s forwards 3s;
}

#intro h2{
  font-size:1rem;
  letter-spacing:4px;
  opacity:.7;
}

#intro h1{
  font-size:3rem;
  color:#ff004c;
  letter-spacing:6px;
  margin-top:10px;
  animation:zoom 3s ease;
}

@keyframes zoom{
  0%{transform:scale(.5);opacity:0}
  100%{transform:scale(1);opacity:1}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

/* SLIDER */
#slider{
  display:flex;
  width:600vw;
  height:100vh;
  transition:1.2s ease;
}

.slide{
  width:100vw;
  height:100vh;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
}

.slide img, .slide video{
  width:320px;
  border-radius:20px;
  margin-top:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.final{
  background:linear-gradient(135deg,#ff5f9e,#ff9a9e);
}

h1{font-size:2.6rem;margin-bottom:20px}
p{max-width:700px;font-size:1.3rem;line-height:1.6}

button{
  padding:14px 30px;
  font-size:1.1rem;
  border:none;
  border-radius:999px;
  cursor:pointer;
  margin:10px;
  transition:.3s;
}

#yesBtn{background:white;color:#ff5f9e}
#noBtn{background:rgba(255,255,255,.8);color:#333}

#counter{margin:20px 0}

/* EXPLOSION */
#yesExplosion{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#ff5f9e,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:1s;
}

#yesExplosion.show{
  opacity:1;
  pointer-events:auto;
}

#yesExplosion h1{
  font-size:4rem;
  text-shadow:0 0 25px white;
}
